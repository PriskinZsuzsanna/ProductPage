<div class="container">
  <div class="card-container">
    @if (isLoading()) {
      <div style="text-align: center;">Loading...</div>
    } @else {
        @if (errorMessage()) {
          <div style="text-align: center;">{{ errorMessage() }}</div>
        } @else {
            <gallery></gallery>
            <article class="card-content">
              <text></text>
              <price></price>
              <actions></actions>
            </article>
        }
    }
  </div>
</div>
